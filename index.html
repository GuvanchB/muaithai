<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muay Thai">
<meta name="theme-color" content="#111114">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Muay Thai Fight</title>
<style>
  :root { --gold: #f4c542; --bg: #111114; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; overflow: hidden;
    font-family: -apple-system, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: min(84%, 520px); pointer-events: none; }
  #hud .lbl { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-align: center; margin-bottom: 5px; opacity: .9; }
  #bar { height: 16px; border-radius: 9px; background: #2a2a30; border: 1.5px solid #fff; overflow: hidden; }
  #fill { height: 100%; width: 100%; background: linear-gradient(#5be07a, #2fb24f); transition: width .25s ease-out, background .25s; }
  #hint { position: absolute; bottom: 8px; width: 100%; text-align: center; font-size: 12px; opacity: .55; pointer-events: none; transition: opacity .6s; }

  #pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; padding: 9px 9px calc(9px + env(safe-area-inset-bottom));
    background: #18181c; border-top: 1px solid #2c2c33; }
  #pad button { appearance: none; border: 1.5px solid rgba(244,197,66,.55); border-radius: 13px; background: #050505; color: var(--gold);
    min-height: 58px; padding: 5px 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font: inherit; touch-action: manipulation; transition: transform .06s, background .06s; }
  #pad button:active, #pad button.hit { transform: scale(.93); background: #2b2408; }
  #pad button .i { font-size: 22px; line-height: 1; }
  #pad button .t { font-size: 10px; font-weight: 800; line-height: 1.15; text-align: center; }
  #pad button.wide { grid-column: span 2; }

  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; background: rgba(0,0,0,.55); z-index: 5; }
  .overlay h1 { margin: 0; font-size: 34px; font-weight: 900; color: var(--gold); letter-spacing: .04em; text-shadow: 0 3px 0 #000; }
  .overlay p { margin: 0; font-size: 14px; opacity: .8; max-width: 280px; line-height: 1.4; }
  .overlay .go { border: 0; border-radius: 30px; padding: 14px 34px; font: inherit; font-size: 18px; font-weight: 900; background: var(--gold); color: #111; }
  #ko { background: rgba(0,0,0,.25); display: none; pointer-events: none; }
  #ko h1 { font-size: 52px; transform: scale(0); transition: transform .35s cubic-bezier(.2,1.6,.4,1); }
  #ko.show h1 { transform: scale(1); }
  #ko p { opacity: 0; transition: opacity .4s; }
  #ko.ready { pointer-events: auto; }
  #ko.ready p { opacity: .9; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud"><div class="lbl">ЗДОРОВЬЕ СОПЕРНИКА</div><div id="bar"><div id="fill"></div></div></div>
    <div id="hint">← проведи пальцем, чтобы двигаться →</div>
    <div class="overlay" id="start">
      <h1>MUAY THAI</h1>
      <p>Подойди ближе свайпом и бей кнопками внизу. Включи звук.</p>
      <button class="go" id="goBtn">В БОЙ!</button>
    </div>
    <div class="overlay" id="ko"><h1>НОКАУТ! 🏆</h1><p>Нажми на экран — заново</p></div>
  </div>
  <div id="pad"></div>
</div>

<script>
"use strict";
// ---------- Удары ----------
const STRIKES = [
  { id: "jabL",   icon: "👊", title: "Прямой левой",     kick: false, zone: "eye",    dmg: 6,  cry: ["Ай!", 1.25, 1.0] },
  { id: "crossR", icon: "👊", title: "Прямой правой",    kick: false, zone: "eye",    dmg: 8,  cry: ["Ох!", 0.95, 1.0] },
  { id: "hookL",  icon: "🤛", title: "Хук слева",        kick: false, zone: "jaw",    dmg: 10, cry: ["Ух!", 0.8, 0.9] },
  { id: "hookR",  icon: "🤜", title: "Хук справа",       kick: false, zone: "jaw",    dmg: 10, cry: ["Уф!", 0.9, 0.9] },
  { id: "upperL", icon: "⤴️", title: "Апперкот слева",   kick: false, zone: "chin",   dmg: 12, cry: ["Ык!", 0.7, 1.0] },
  { id: "upperR", icon: "⤴️", title: "Апперкот справа",  kick: false, zone: "chin",   dmg: 12, cry: ["Гык!", 0.75, 1.0] },
  { id: "groinL", icon: "🦵", title: "Левой в пах",      kick: true,  zone: "groin",  dmg: 14, cry: ["Иииии!", 2.0, 0.7] },
  { id: "groinR", icon: "🦵", title: "Правой в пах",     kick: true,  zone: "groin",  dmg: 14, cry: ["Уииии!", 1.9, 0.7] },
  { id: "headL",  icon: "🦶", title: "Левой в голову",   kick: true,  zone: "temple", dmg: 16, cry: ["Ааах!", 0.65, 0.8] },
  { id: "headR",  icon: "🦶", title: "Правой в голову",  kick: true,  zone: "temple", dmg: 16, cry: ["Оооох!", 0.6, 0.8] },
  { id: "spin",   icon: "🌀", title: "С разворота в челюсть", kick: true, zone: "jaw", dmg: 25, cry: ["Уаааа!", 0.5, 0.7], spin: true },
];
// Точки попадания в координатах соперника (единица = 1% роста, y вверх)
const ZONES = { eye: [-5, 92.5], temple: [1.5, 91], jaw: [-5.5, 83.5], chin: [-6.5, 81.5], groin: [-3, 36] };

// ---------- Канвас ----------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const stage = document.getElementById("stage");
let W = 0, Hs = 0, dpr = 1;
let G = 0, H = 0, u = 0;      // линия пола, рост героя, 1% роста соперника
const heroImg = new Image(); heroImg.src = "hero.png";
let heroAR = 832 / 1496;

// ---------- Состояние ----------
const S = {};
function reset() {
  Object.assign(S, {
    health: 100, fear: 0, fearShown: 0, busy: false, ko: false, koT: 0, canRestart: false,
    heroX: 0, attack: null, foeRot: 0, foeRotV: 0, foeFallX: 0, bruises: [], fx: [], shake: 0, cam: 1,
    hair: makeHair(),
  });
  layout(true);
  updateBar();
  document.getElementById("ko").className = "overlay";
  document.getElementById("ko").style.display = "none";
}
function makeHair() {
  const a = [];
  for (let i = 0; i < 17; i++) {
    const ang = 0.15 + (Math.PI * 1.05) * i / 16 + (Math.random() - .5) * 0.25;
    a.push({ ang, len: 3 + Math.random() * 4.5, w: 2 + Math.random() * 1.8, bend: (Math.random() - .5) * 0.9 });
  }
  return a;
}
function layout(resetHero) {
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = r.width; Hs = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hs * dpr);
  G = Hs * 0.9;
  H = Math.min(Hs * 0.64, W * 0.54);
  u = H * 1.1 / 100;
  const hw = heroHalf();
  if (resetHero || !S.heroX) S.heroX = Math.max(W * 0.2, hw + 6);
  S.heroX = clamp(S.heroX, minX(), maxX());
}
const foeX = () => W * 0.76;
const heroHalf = () => H * heroAR / 2;
const minX = () => heroHalf() + 4;
const maxX = () => foeX() - 14 * u - heroHalf() * 0.85;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
window.addEventListener("resize", () => layout(false));
heroImg.onload = () => { heroAR = heroImg.width / heroImg.height; layout(false); };

// ---------- Звук ----------
let AC = null, ruVoice = null;
function initAudio() {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch (e) {}
  if ("speechSynthesis" in window) {
    const pick = () => { const v = speechSynthesis.getVoices(); ruVoice = v.find(x => /^ru/i.test(x.lang)) || null; };
    pick(); speechSynthesis.onvoiceschanged = pick;
    const w = new SpeechSynthesisUtterance(" "); w.volume = 0; speechSynthesis.speak(w); // разблокировка на iOS
  }
}
function say(text, pitch, rate) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const s = new SpeechSynthesisUtterance(text);
  s.lang = "ru-RU"; if (ruVoice) s.voice = ruVoice;
  s.pitch = pitch; s.rate = rate; s.volume = 1;
  speechSynthesis.speak(s);
}
function noise(dur) {
  const b = AC.createBuffer(1, Math.floor(AC.sampleRate * dur), AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const n = AC.createBufferSource(); n.buffer = b; return n;
}
function whoosh(heavy) {
  if (!AC) return; const t = AC.currentTime;
  const n = noise(heavy ? 0.28 : 0.16), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = "bandpass"; f.Q.value = 1.2; f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(2200, t + (heavy ? .25 : .14));
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + .05); g.gain.exponentialRampToValueAtTime(0.0001, t + (heavy ? .28 : .16));
  n.connect(f).connect(g).connect(AC.destination); n.start(t);
}
function thud(power) {
  if (!AC) return; const t = AC.currentTime;
  const o = AC.createOscillator(), og = AC.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(45, t + .18);
  og.gain.setValueAtTime(0.9 * power, t); og.gain.exponentialRampToValueAtTime(0.0001, t + .22);
  o.connect(og).connect(AC.destination); o.start(t); o.stop(t + .25);
  const n = noise(0.09), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = "lowpass"; f.frequency.value = 1800; g.gain.value = 0.7 * power;
  n.connect(f).connect(g).connect(AC.destination); n.start(t);
}
function thump() { // падение на ринг
  if (!AC) return; const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(30, t + .4);
  g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + .45);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .5);
  const n = noise(0.2), f = AC.createBiquadFilter(), g2 = AC.createGain();
  f.type = "lowpass"; f.frequency.value = 600; g2.gain.value = 0.8;
  n.connect(f).connect(g2).connect(AC.destination); n.start(t);
}

// ---------- Кнопки ----------
const pad = document.getElementById("pad");
STRIKES.forEach(s => {
  const b = document.createElement("button");
  b.innerHTML = `<span class="i">${s.icon}</span><span class="t">${s.title}</span>`;
  if (s.spin) b.classList.add("wide");
  b.addEventListener("touchstart", e => { e.preventDefault(); b.classList.add("hit"); perform(s); }, { passive: false });
  b.addEventListener("touchend", () => b.classList.remove("hit"));
  b.addEventListener("touchcancel", () => b.classList.remove("hit"));
  b.addEventListener("click", () => perform(s));
  pad.appendChild(b);
});
const KEYS = { "1": 0, "2": 1, "3": 2, "4": 3, "5": 4, "6": 5, "7": 6, "8": 7, "9": 8, "0": 9, " ": 10 };
window.addEventListener("keydown", e => {
  if (e.key in KEYS) perform(STRIKES[KEYS[e.key]]);
  if (e.key === "ArrowLeft") S.heroX = clamp(S.heroX - 14, minX(), maxX());
  if (e.key === "ArrowRight") S.heroX = clamp(S.heroX + 14, minX(), maxX());
});

// ---------- Свайп: только по горизонтали ----------
let lastTX = null;
cv.addEventListener("pointerdown", e => { lastTX = e.clientX; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (lastTX === null || S.ko || S.busy) { lastTX = e.clientX; return; }
  S.heroX = clamp(S.heroX + (e.clientX - lastTX) * 1.15, minX(), maxX());
  lastTX = e.clientX;
  document.getElementById("hint").style.opacity = 0;
});
const endDrag = () => lastTX = null;
cv.addEventListener("pointerup", endDrag); cv.addEventListener("pointercancel", endDrag);

// ---------- Атака ----------
function perform(s) {
  if (S.busy || S.ko || !started) return;
  S.busy = true;
  const reach = H * (s.spin ? 0.9 : s.kick ? 0.78 : 0.64);
  const hit = foeX() - S.heroX <= reach;
  const dur = s.spin ? 0.62 : s.kick ? 0.46 : 0.36;
  S.attack = { s, t: 0, dur, hit, launched: false };
  whoosh(s.kick);
}
function launch(a) {
  const s = a.s;
  const from = heroPoint(s);
  const to = a.hit ? foeToWorld(ZONES[s.zone]) : { x: S.heroX + H * 0.72, y: G - (s.zone === "groin" ? H * 0.34 : H * 0.8) };
  S.fx.push({ type: "proj", t: 0, dur: 0.08, from, to, icon: s.kick ? "🦶" : "🥊", flip: false,
    done: () => a.hit ? impact(s, to) : miss(to) });
}
function heroPoint(s) {
  const iw = H * heroAR, lunge = attackLunge();
  if (s.kick) return { x: S.heroX + lunge + iw * 0.3, y: G - (s.zone === "groin" ? H * 0.2 : H * 0.45) };
  return { x: S.heroX + lunge + iw * 0.2, y: G - H * 0.75 };
}
function impact(s, p) {
  S.fx.push({ type: "text", t: 0, dur: 0.35, x: p.x, y: p.y, text: "💥", size: H * 0.17, grow: 1.7 });
  S.fx.push({ type: "dmg", t: 0, dur: 0.8, x: p.x + 10, y: p.y - 10, text: "-" + s.dmg });
  thud(s.spin ? 1.3 : s.kick ? 1.1 : 0.8);
  const z = ZONES[s.zone];
  S.bruises.push({ x: z[0] + (Math.random() - .5) * 3, y: z[1] + (Math.random() - .5) * 3,
    r: (s.zone === "groin" ? 3.6 : 2.5) * (0.85 + Math.random() * 0.35) * (s.spin ? 1.3 : 1), t: 0 });
  S.health = Math.max(0, S.health - s.dmg);
  S.fear = 1 - S.health / 100;
  S.shake = s.spin ? 9 : s.kick ? 6 : 4;
  updateBar();
  if (S.health <= 0) { knockOut(); return; }
  say(...s.cry);
  S.foeRotV += s.zone === "groin" ? -3.2 : (s.spin ? 5 : 2.6); // в пах — сгибается вперёд, в голову — откидывается
}
function miss(p) {
  S.fx.push({ type: "dmg", t: 0, dur: 0.6, x: p.x, y: p.y, text: "МИМО", color: "#bbb" });
}
function updateBar() {
  const v = S.health / 100, f = document.getElementById("fill");
  f.style.width = (v * 100) + "%";
  f.style.background = v > .6 ? "linear-gradient(#5be07a,#2fb24f)" : v > .3 ? "linear-gradient(#ffd84d,#e0a800)" : "linear-gradient(#ff6b6b,#d62828)";
}
function knockOut() {
  S.ko = true; S.koT = 0;
  say("Аааааа! Всё, сдаюсь!", 0.55, 0.75);
  const ko = document.getElementById("ko");
  ko.style.display = "flex";
  setTimeout(() => ko.classList.add("show"), 900);
  setTimeout(() => { ko.classList.add("ready"); S.canRestart = true; }, 1900);
}
document.getElementById("ko").addEventListener("pointerdown", () => { if (S.canRestart) reset(); });

// ---------- Координаты соперника ----------
function foeOrigin() {
  const shakeX = (!S.ko && S.fearShown > 0.45) ? Math.sin(perfT * 70) * 1.3 * S.fearShown * u * 0.7 : 0;
  return { x: foeX() + shakeX + S.foeFallX, y: G };
}
function foeToWorld([lx, ly]) {
  const o = foeOrigin(), c = Math.cos(S.foeRot), s = Math.sin(S.foeRot);
  const x = lx * u, y = -ly * u;
  return { x: o.x + x * c - y * s, y: o.y + x * s + y * c };
}
function attackLunge() {
  const a = S.attack; if (!a) return 0;
  const p = a.t / a.dur;
  const peak = H * (a.s.kick ? 0.13 : 0.1);
  return p < 0.35 ? peak * easeOut(p / 0.35) : peak * (1 - easeInOut((p - 0.35) / 0.65));
}
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

// ---------- Цикл ----------
let perfT = 0, lastFrame = performance.now(), started = false;
function tick(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now; perfT += dt;
  update(dt); draw();
  requestAnimationFrame(tick);
}
function update(dt) {
  S.fearShown = lerp(S.fearShown, S.fear, 1 - Math.exp(-dt * 10));
  const a = S.attack;
  if (a) {
    a.t += dt;
    if (!a.launched && a.t >= a.dur * 0.3) { a.launched = true; launch(a); }
    if (a.t >= a.dur) { S.attack = null; S.busy = false; }
  }
  for (const f of S.fx) { f.t += dt; if (f.t >= f.dur && f.done) { const d = f.done; f.done = null; d(); } }
  S.fx = S.fx.filter(f => f.t < f.dur);
  S.bruises.forEach(b => b.t += dt);
  S.shake *= Math.exp(-dt * 12);

  if (S.ko) {
    S.koT += dt;
    const p = clamp((S.koT - 0.15) / 0.65, 0, 1);
    const prev = S.foeRot;
    S.foeRot = Math.PI / 2 * (p * p);                       // падает назад
    if (p >= 1 && prev < Math.PI / 2 - 1e-3) { thump(); S.shake = 10; }
    const bodyLen = 106 * u;
    const need = foeX() + bodyLen + 10;
    const target = need > W ? (W - 10) / need : 1;
    S.cam = lerp(S.cam, Math.min(1, target), 1 - Math.exp(-dt * 4));
  } else {
    // пружина наклона после удара
    S.foeRotV += (-S.foeRot * 90 - S.foeRotV * 11) * dt;
    S.foeRot += S.foeRotV * dt;
    S.foeRot = clamp(S.foeRot, -0.35, 0.3);
    S.cam = lerp(S.cam, 1, 1 - Math.exp(-dt * 4));
  }
}

// ---------- Рисование ----------
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBackground();
  ctx.save();
  const sx = (Math.random() - .5) * S.shake, sy = (Math.random() - .5) * S.shake;
  ctx.translate(sx, sy);
  ctx.translate(0, G); ctx.scale(S.cam, S.cam); ctx.translate(0, -G);
  drawShadow(foeOrigin().x + (S.ko ? 50 * u * Math.sin(S.foeRot) : 0), 16 * u + (S.ko ? 40 * u * Math.sin(S.foeRot) : 0));
  drawShadow(S.heroX + attackLunge(), H * 0.3);
  drawFoe();
  drawHero();
  drawFx();
  ctx.restore();
}
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, Hs);
  g.addColorStop(0, "#1b1d24"); g.addColorStop(1, "#0b0b0e");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hs);
  // прожектор
  const sp = ctx.createRadialGradient(W * 0.5, G - H * 0.6, 10, W * 0.5, G - H * 0.4, Math.max(W, Hs) * 0.7);
  sp.addColorStop(0, "rgba(255,240,210,.20)"); sp.addColorStop(1, "rgba(255,240,210,0)");
  ctx.fillStyle = sp; ctx.fillRect(0, 0, W, Hs);
  // баннер на стене
  ctx.save(); ctx.globalAlpha = 0.07; ctx.fillStyle = "#fff";
  ctx.font = `900 ${Math.round(W * 0.2)}px -apple-system, Arial`; ctx.textAlign = "center";
  ctx.fillText("MUAY THAI", W / 2, G - H * 1.05); ctx.restore();
  // пол ринга
  const f = ctx.createLinearGradient(0, G - 4, 0, Hs);
  f.addColorStop(0, "#3a3c46"); f.addColorStop(1, "#1d1e24");
  ctx.fillStyle = f; ctx.fillRect(0, G - 2, W, Hs - G + 2);
  ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.fillRect(0, G - 2, W, 2);
  // канаты
  const colors = ["#e8e8e8", "#d62828", "#1f4fd6"];
  for (let i = 0; i < 3; i++) {
    const y = G - H * (0.3 + i * 0.26);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(0, y + 3, W, 4);
    const rg = ctx.createLinearGradient(0, y - 3, 0, y + 3);
    rg.addColorStop(0, "#fff"); rg.addColorStop(0.35, colors[i]); rg.addColorStop(1, "#000");
    ctx.fillStyle = rg; ctx.fillRect(0, y - 3, W, 6);
  }
  // угловая стойка
  const px = W - 10;
  const pg = ctx.createLinearGradient(px - 8, 0, px + 8, 0);
  pg.addColorStop(0, "#222"); pg.addColorStop(.5, "#666"); pg.addColorStop(1, "#111");
  ctx.fillStyle = pg; ctx.fillRect(px - 7, G - H * 1.15, 14, H * 1.15);
}
function drawShadow(x, rx) {
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.beginPath(); ctx.ellipse(x, G + 2, rx, Math.max(4, rx * 0.12), 0, 0, Math.PI * 2); ctx.fill();
}
function drawHero() {
  const h = H * (1 + Math.sin(perfT * 3.2) * 0.006), w = H * heroAR;
  const a = S.attack;
  let rot = 0, flip = 1;
  if (a) {
    const p = a.t / a.dur;
    if (a.s.spin) flip = Math.cos(p * Math.PI * 2);
    else rot = (a.s.kick ? -0.1 : -0.04) * Math.sin(Math.PI * p);
  }
  ctx.save();
  ctx.translate(S.heroX + attackLunge(), G);
  ctx.rotate(rot); ctx.scale(Math.abs(flip) < 0.05 ? 0.05 * Math.sign(flip || 1) : flip, 1);
  if (heroImg.complete && heroImg.naturalWidth) ctx.drawImage(heroImg, -w / 2, -h, w, h);
  else { ctx.fillStyle = "#000"; ctx.fillRect(-w / 4, -h * 0.8, w / 2, h * 0.8); }
  ctx.restore();
}

// Соперник: мужчина ~20 лет, майка, шорты, взлохмаченные волосы, босиком
function mixColor(a, b, t) { return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(",")})`; }
function drawFoe() {
  const f = S.fearShown, t = perfT, o = foeOrigin();
  const skinA = [226, 176, 136], skinPale = [226, 200, 176];
  const skin = mixColor(skinA, skinPale, f * 0.6);
  const skinD = mixColor([196, 146, 108], [200, 170, 146], f * 0.6);
  const hairC = "#2a1a0e", line = "rgba(60,30,20,.55)", OUT = "rgba(40,20,10,.75)";
  const breathe = Math.sin(t * 2.4) * 0.35;

  ctx.save();
  ctx.translate(o.x, o.y); ctx.rotate(S.foeRot); ctx.scale(u, -u);
  ctx.lineJoin = "round"; ctx.lineCap = "round";

  const E = (x, y, rx, ry, c, rot = 0) => { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); };
  const P = (pts, c, stroke) => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fillStyle = c; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 0.5; ctx.stroke(); } };
  const L = (pts, w, c) => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke(); };
  const knees = f * 1.5; // колени подгибаются от страха

  // дальняя рука
  const bh = [lerp(11, 5, f), lerp(49, 70, f) + Math.sin(t * 40) * f * 0.4], be = [lerp(13.5, 13, f), lerp(61, 62, f)];
  L([[8.5, 73.5 + breathe], be, bh], 7, OUT); L([[8.5, 73.5 + breathe], be, bh], 6.2, skinD); E(bh[0], bh[1], 3.2, 3.4, OUT); E(bh[0], bh[1], 2.8, 3, skinD);
  // дальняя нога и ступня
  L([[4.2, 36], [4.2 + knees, 18], [4.5, 3]], 8.6, OUT); L([[4.2, 36], [4.2 + knees, 18], [4.5, 3]], 7.8, skinD);
  E(2.2, 1.6, 5.6, 1.9, skinD);
  // ближняя нога
  L([[-4.2, 36], [-4.2 - knees, 18], [-4.8, 3]], 8.8, OUT); L([[-4.2, 36], [-4.2 - knees, 18], [-4.8, 3]], 8, skin);
  E(-7.4, 1.7, 5.9, 2, skin); E(-12.2, 2, 1.2, 1.1, skinD);
  L([[-4.6, 19], [-3.6, 17]], 0.4, line);
  // шорты
  P([[-12.2, 50], [12.2, 50], [13.2, 29.5], [1.6, 29.5], [0, 35], [-1.6, 29.5], [-13.2, 29.5]], "#4b5d7e", OUT);
  P([[-12.2, 50], [12.2, 50], [12.3, 47.8], [-12.3, 47.8]], "#3a4966");
  L([[-12.8, 46], [-13, 31]], 0.8, "rgba(255,255,255,.55)");
  L([[-1.2, 47], [-0.4, 40]], 0.35, "rgba(0,0,0,.25)");
  // майка
  P([[-11.2, 49], [11.2, 49], [11.8, 67], [9.2, 71], [8.4, 77.5 + breathe], [5.8, 77.5 + breathe], [3.4, 73.5], [-3.4, 73.5],
     [-5.8, 77.5 + breathe], [-8.4, 77.5 + breathe], [-9.2, 71], [-11.8, 67]], "#ecebe4", OUT);
  ctx.save(); ctx.globalAlpha = 0.18; P([[5, 49], [11.2, 49], [11.8, 67], [9.2, 71], [7, 70]], "#000"); ctx.restore();
  E(-3, 60, 2.2, 1.4, "rgba(200,190,150,.35)"); // пятно на майке
  L([[-6, 52], [-2, 55]], 0.3, "rgba(0,0,0,.12)"); L([[3, 64], [7, 66]], 0.3, "rgba(0,0,0,.12)");
  // шея
  P([[-3.2, 73.5], [3.2, 73.5], [3.4, 81], [-3.4, 81]], skin);
  // голова
  E(0, 90.5, 9.4, 10.7, OUT); E(-3.3, 85, 6.8, 5.8, OUT);
  E(0, 90.5, 9, 10.3, skin);
  E(-3.3, 85, 6.4, 5.4, skin);
  E(0.4, 83.2, 5, 3.4, "rgba(80,50,30,.10)"); // щетина
  // затылок (волосы сзади) и ухо
  E(5.8, 91.5, 3.6, 6.2, hairC, -0.2);
  E(4.2, 89.5, 2, 3.1, skin); E(4.3, 89.5, 1, 1.9, skinD);
  // нос
  P([[-7.6, 93], [-10.6, 88.3], [-9.4, 87.4], [-7.4, 87.8]], skin, line);
  // волосы: шапка и торчащие пряди
  E(0.8, 96.2, 9.6, 6.8, hairC);
  for (const s of S.hair) {
    const wob = Math.sin(t * 6 + s.ang * 3) * 0.08 * (0.3 + f);
    const a = Math.PI - s.ang + wob;                 // 0 — затылок, π — лоб
    const bx = 0.8 + Math.cos(a) * 8, by = 94.5 + Math.sin(a) * 6.5;
    const tx = 0.8 + Math.cos(a + s.bend * 0.3) * (8 + s.len), ty = 94.5 + Math.sin(a + s.bend * 0.3) * (6.5 + s.len);
    const nx = -Math.sin(a) * s.w / 2, ny = Math.cos(a) * s.w / 2;
    P([[bx + nx, by + ny], [tx, ty], [bx - nx, by - ny]], hairC);
  }
  // чёлка на лбу
  P([[-8.6, 94.5], [-6.5, 99], [-4, 95.6], [-3.2, 99.5], [-0.5, 96.2], [1, 100], [-2, 102], [-7, 100.5]], hairC);

  if (!S.ko || S.koT < 0.8) {
    // глаза
    const jitter = f > 0.5 ? Math.sin(t * 55) * 0.25 * f : 0;
    [[-5.1, 92.6, 1], [-0.9, 92.9, 0.8]].forEach(([ex, ey, k]) => {
      const rx = 1.6 * (1 + 0.8 * f) * k, ry = 1.05 * (1 + 1.3 * f) * k;
      E(ex, ey, rx + 0.25, ry + 0.25, "rgba(90,50,40,.5)");
      E(ex, ey, rx, ry, "#fff");
      const pr = 0.8 * (1 - 0.5 * f) * k;
      E(ex - rx * 0.35 + jitter, ey + jitter * 0.5, pr, pr, "#2b1a10");
      E(ex - rx * 0.35 + 0.25, ey + 0.3, pr * 0.3, pr * 0.3, "#fff");
    });
    // брови — поднимаются «домиком» от страха
    [[-5.1, 1], [-0.9, -1]].forEach(([bx, dir]) => {
      ctx.save(); ctx.translate(bx, 95 + f * 2.2); ctx.rotate(dir * 0.55 * f);
      L([[-1.9, 0], [1.9, 0]], 0.8, hairC); ctx.restore();
    });
    // рот
    if (f < 0.08) L([[-6.3, 84.4], [-3.2, 84.2]], 0.5, "#6b2a22");
    else {
      const ry = 0.3 + 2.6 * f, rx = 1.6 + 0.9 * f;
      E(-4.6, 84.4 - ry * 0.4, rx, ry, "#5a0f14");
      if (ry > 0.9) E(-4.6, 84.4 - ry * 0.4 + ry * 0.62, rx * 0.8, 0.45, "#fff");
    }
    // пот
    const sa = clamp((f - 0.25) * 2, 0, 1);
    if (sa > 0) {
      ctx.globalAlpha = sa;
      [[3, 98.5, 0], [-9.3, 95.5, 1.3], [6.5, 94, 2.1]].forEach(([x, y, ph]) => {
        const dy = ((t * 1.3 + ph) % 2) * 1.5;
        P([[x, y - dy + 1.3], [x - 0.8, y - dy], [x, y - dy - 0.6], [x + 0.8, y - dy]], "#9fd8ff");
      });
      ctx.globalAlpha = 1;
    }
    // слёзы при сильном страхе
    if (f > 0.65) {
      ctx.globalAlpha = clamp((f - 0.65) * 4, 0, 1);
      const len = 2 + ((t * 2) % 4);
      L([[-5.6, 91.3], [-5.9, 91.3 - len]], 0.55, "#7cc6ff");
      ctx.globalAlpha = 1;
    }
  } else {
    // нокаут: глаза-крестики
    [[-5.1, 92.6], [-0.9, 92.9]].forEach(([x, y]) => { L([[x - 1, y - 1], [x + 1, y + 1]], 0.55, "#222"); L([[x - 1, y + 1], [x + 1, y - 1]], 0.55, "#222"); });
    E(-4.6, 83.6, 2.2, 1.6, "#5a0f14");
  }

  // синяки
  for (const b of S.bruises) {
    const k = Math.min(1, b.t / 0.25), r = b.r * (0.3 + 0.7 * k);
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r * 1.2);
    g.addColorStop(0, "rgba(70,10,55,.8)"); g.addColorStop(0.45, "rgba(115,35,110,.55)");
    g.addColorStop(0.8, "rgba(120,110,40,.18)"); g.addColorStop(1, "rgba(120,110,40,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(b.x, b.y, r * 1.2, r, 0, 0, Math.PI * 2); ctx.fill();
  }

  // ближняя рука — от страха закрывается
  const fh = [lerp(-12, -8.5, f), lerp(49.5, 79, f) + Math.sin(t * 45) * f * 0.5], fe = [lerp(-13.8, -16.5, f), lerp(61, 67, f)];
  L([[-8.5, 73.5 + breathe], fe, fh], 7.4, OUT); L([[-8.5, 73.5 + breathe], fe, fh], 6.6, skin); E(fh[0], fh[1], 3.3, 3.5, OUT); E(fh[0], fh[1], 2.9, 3.1, skin);
  L([[fh[0] - 1.6, fh[1] + 1], [fh[0] - 1.2, fh[1] - 1.2]], 0.3, line);

  ctx.restore();

  // звёздочки после нокаута
  if (S.ko && S.koT > 0.8) {
    const head = foeToWorld([0, 92]);
    ctx.font = `${Math.round(H * 0.08)}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let i = 0; i < 3; i++) {
      const a = perfT * 3 + i * 2.09;
      ctx.fillText("⭐", head.x + Math.cos(a) * 14 * u, head.y - 14 * u + Math.sin(a) * 4 * u);
    }
  }
}
function drawFx() {
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const f of S.fx) {
    const p = f.t / f.dur;
    if (f.type === "proj") {
      ctx.font = `${Math.round(H * 0.13)}px sans-serif`;
      ctx.globalAlpha = 0.9;
      ctx.fillText(f.icon, lerp(f.from.x, f.to.x, p), lerp(f.from.y, f.to.y, p));
    } else if (f.type === "text") {
      ctx.globalAlpha = 1 - p; ctx.font = `${Math.round(f.size * (1 + (f.grow - 1) * p))}px sans-serif`;
      ctx.fillText(f.text, f.x, f.y);
    } else if (f.type === "dmg") {
      ctx.globalAlpha = 1 - p * p;
      ctx.font = `900 ${Math.round(H * 0.09)}px -apple-system, Arial`;
      ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.fillStyle = f.color || "#ff4d4d";
      ctx.strokeText(f.text, f.x, f.y - p * 40); ctx.fillText(f.text, f.x, f.y - p * 40);
    }
    ctx.globalAlpha = 1;
  }
}

  document.getElementById("start").style.display = "none";

requestAnimationFrame(tick);
